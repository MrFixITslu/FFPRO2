name: FFPRO private database boundary (nondeploying)
on:
  pull_request:
    paths:
      - docker-compose.yml
      - tests/databaseNetworkBoundary.test.mjs
      - .github/workflows/ffpro-db-network-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/databaseNetworkBoundary.test.mjs
