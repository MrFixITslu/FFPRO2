name: Production readiness checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffpro_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ffpro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ffpro_test -d ffpro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ffpro_test:ci-only-password@localhost:5432/ffpro_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker build -t ffpro2-ci .
