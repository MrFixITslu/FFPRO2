name: Continuous Delivery

on:
  workflow_run:
    workflows: ["Production readiness checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deliver:
    name: Package and publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    timeout-minutes: 20

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Create release bundle
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude='.env.*' \
              --exclude=data --exclude=backups --exclude=uploads --exclude=build --exclude='*.tar.gz' \
              -czf "${RUNNER_TEMP}/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz" .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Detect Dockerfile
        id: docker
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish validated Docker image
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        shell: bash
        run: |
          IMAGE="${{ steps.docker.outputs.image }}"
          COMMIT="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT::12}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

  deploy:
    name: Deploy validated release to server
    runs-on: ubuntu-latest
    needs: deliver
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment: production
    # These are deployment coordinates, not credentials.
    env:
      DEPLOY_HOST: 100.73.248.30
      DEPLOY_USER: firelion
      DEPLOY_ROOT: /home/firelion/FFPRO2
      DEPLOY_PROJECT: ffpro2
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release
      - name: Join deployment tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.DEPLOY_HOST }}
      - name: Configure pinned SSH host
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          python3 .github/scripts/write-deploy-key.py "$HOME/.ssh/id_ed25519"
          # Public host key verified through an existing strict SSH connection to production.
          host_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILct6nfEHcK9bJRthFDt7863FEa2YvtNn+PQBaxKUfXE'
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port" >&2; exit 1; }
          known_host="$DEPLOY_HOST"
          if [ "$port" != 22 ]; then known_host="[$DEPLOY_HOST]:$port"; fi
          printf '%s %s\n' "$known_host" "$host_key" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:aZbfFVQ2DRx3JZofPkgF5JyMhKtnyCVKeHNCtpYLS5E'
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null || { echo "DEPLOY_SSH_KEY is not a usable OpenSSH private key" >&2; exit 1; }
      - name: Transfer and deploy release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          for name in RELEASE_SHA DEPLOY_HOST DEPLOY_USER DEPLOY_ROOT DEPLOY_PROJECT; do
            test -n "${!name}" || { echo "Missing production setting: $name" >&2; exit 1; }
          done
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 1
          archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$archive"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -P "$port" -o StrictHostKeyChecking=yes "$archive" "$target:v79-release-${RELEASE_SHA}.tar.gz"
          ssh -p "$port" -o StrictHostKeyChecking=yes "$target" bash -s -- "$RELEASE_SHA" "$DEPLOY_ROOT" "$DEPLOY_PROJECT" "fire-finance" < scripts/deploy-server.sh
