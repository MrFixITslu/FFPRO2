services:
  postgres:
    image: postgres:16-alpine
    container_name: fire-finance-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ffpro2_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the existing database password}
      - POSTGRES_DB=${POSTGRES_DB:-fire_finance}
    volumes:
      # Dedicated, persistent volume for FFPRO2's own database — separate
      # from every other app's data on this server.
      - ffpro2_pgdata:/var/lib/postgresql/data
    networks:
      - database_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffpro2_user} -d ${POSTGRES_DB:-fire_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  fire-finance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fire-finance-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3010"
    networks:
      - proxy_network
      - database_internal

    environment:
      - NODE_ENV=production
      - PORT=3010

      # Persist Database and Keys
      - DATABASE_FILE=/app/data/database.json
      - ENCRYPTION_KEY_FILE=/app/data/encryption.key

      # Master Encryption Keys (Will read from your server's .env file, or read the existing encryption key file)
      - SESSION_SECRET=${SESSION_SECRET:?Set a stable SESSION_SECRET of at least 32 characters}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - V79_PLATFORM_SHARED_SECRET=${V79_PLATFORM_SHARED_SECRET:-}
      - V79_HUB_EVENT_URL=${V79_HUB_EVENT_URL:-http://v79-hub:3040/api/platform/events}
      - V79_HUB_EVENT_SECRET=${V79_HUB_EVENT_SECRET:-}
      - V79_HUB_PUBLIC_URL=${V79_HUB_PUBLIC_URL:-https://hub.v79sl.com}
      - V79_HUB_INTERNAL_URL=${V79_HUB_INTERNAL_URL:-http://v79-hub:3040}
      - V79_FFPRO_LAUNCH_SECRET=${V79_FFPRO_LAUNCH_SECRET:-}
      - V79_ALLOW_LEGACY_AUTH=${V79_ALLOW_LEGACY_AUTH:-0}
      - V79_ALLOW_EMAIL_ACCOUNT_LINK=${V79_ALLOW_EMAIL_ACCOUNT_LINK:-0}

      # Database Connection — dedicated FFPRO2 Postgres container defined above.
      # Host is the Docker service name "postgres", resolved over database_internal.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ffpro2_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the existing database password}@postgres:5432/${POSTGRES_DB:-fire_finance}

      # Gemini AI Integration
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Funding Finder — uses Ollama if available
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_MAX_CONCURRENT=${OLLAMA_MAX_CONCURRENT:-1}
      - OLLAMA_REQUEST_TIMEOUT_MS=${OLLAMA_REQUEST_TIMEOUT_MS:-60000}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FUNDING_RESEARCH_SCHEDULE=${FUNDING_RESEARCH_SCHEDULE:-0 2 * * *}
      - FUNDING_RESEARCH_MAX_URLS_PER_RUN=${FUNDING_RESEARCH_MAX_URLS_PER_RUN:-15}
      - FUNDING_RESEARCH_MAX_RUN_MINUTES=${FUNDING_RESEARCH_MAX_RUN_MINUTES:-45}
      - FUNDING_SEARCH_QUERIES=${FUNDING_SEARCH_QUERIES:-}

      # OAuth - Google Developer Portal
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-/api/auth/google/callback}

      # OAuth - Meta Developer Portal
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL:-/api/auth/facebook/callback}

      # Outgoing Email - project-share invites (optional)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}

      # Base Application URLs (required canonical public HTTPS origin)
      - FRONTEND_URL=${FRONTEND_URL:?Set the canonical HTTPS app origin}
      - FFPRO_INTERNAL_HOST=fire-finance-app:3010
    volumes:
      # Persistent local data directory for encryption key + session store.
      - ./data:/app/data

networks:
  proxy_network:
    name: proxy_network
    external: true
  database_internal:
    internal: true

volumes:
  ffpro2_pgdata:
    name: ffpro2_pgdata
