services:
  postgres:
    image: postgres:16-alpine
    container_name: fire-finance-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ffpro2_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-fire_finance}
    volumes:
      # Dedicated, persistent volume for FFPRO2's own database — separate
      # from every other app's data on this server.
      - ffpro2_pgdata:/var/lib/postgresql/data
    networks:
      - proxy_network
      - ffpro2_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffpro2_user} -d ${POSTGRES_DB:-fire_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fire-finance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fire-finance-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3010}:80"
    networks:
      - proxy_network
      - ffpro2_internal

    environment:
      - NODE_ENV=production
      - PORT=80
      
      # Persist Database and Keys
      - DATABASE_FILE=/app/data/database.json
      - ENCRYPTION_KEY_FILE=/app/data/encryption.key
      
      # Master Encryption Keys (Will read from your server's .env file, or auto-generate on boot)
      - SESSION_SECRET=${SESSION_SECRET}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      
      # Database Connection — dedicated FFPRO2 Postgres container defined above.
      # Host is the Docker service name "postgres", resolved over ffpro2_internal.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ffpro2_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fire_finance}
      
      # Gemini AI Integration
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Funding Finder — uses the EXISTING Ollama container (already running
      # on proxy_network, which this service already joins below). Never
      # installs/manages Ollama itself.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_MAX_CONCURRENT=${OLLAMA_MAX_CONCURRENT:-1}
      - OLLAMA_REQUEST_TIMEOUT_MS=${OLLAMA_REQUEST_TIMEOUT_MS:-60000}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FUNDING_RESEARCH_SCHEDULE=${FUNDING_RESEARCH_SCHEDULE:-0 2 * * *}
      - FUNDING_RESEARCH_MAX_URLS_PER_RUN=${FUNDING_RESEARCH_MAX_URLS_PER_RUN:-15}
      - FUNDING_RESEARCH_MAX_RUN_MINUTES=${FUNDING_RESEARCH_MAX_RUN_MINUTES:-45}
      - FUNDING_SEARCH_QUERIES=${FUNDING_SEARCH_QUERIES:-}
      
      # OAuth - Google Developer Portal
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-/api/auth/google/callback}
      
      # OAuth - Meta Developer Portal
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL:-/api/auth/facebook/callback}
      
      # Outgoing Email - project-share invites (optional)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      
      # Base Application URLs (auto-detected from request headers if blank)
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      # Persistent local data directory for encryption key + session store.
      # (App data itself now lives in the "postgres" service above.)
      - ./data:/app/data

networks:
  # Join your existing external Nginx/OpenResty proxy network
  proxy_network:
    external: true
  # Private network shared only between fire-finance and its own Postgres.
  ffpro2_internal:
    driver: bridge

volumes:
  ffpro2_pgdata:
    name: ffpro2_pgdata
